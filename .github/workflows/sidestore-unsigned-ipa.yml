name: Build unsigned SideStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/sidestore-app-group-entitlements"
    paths:
      - "SideStore-Upstream/**"
      - ".github/workflows/sidestore-unsigned-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -project SideStore-Upstream/AltStore.xcodeproj \
            -scheme SideStore \
            -resolvePackageDependencies

      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild \
            -project SideStore-Upstream/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/SideStore.app"
          test -d "$APP_PATH"
          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/
          cd build/IPA
          zip -r SideStore-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-unsigned-IPA
          path: build/IPA/SideStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
