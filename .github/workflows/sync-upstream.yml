name: Sync upstream sources

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch SideStore integration source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/SideStore
          git clone --recurse-submodules --branch LiveContainerSupport --single-branch https://github.com/LiveContainer/SideStore.git /tmp/SideStore

      - name: Import SideStore upstream source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SideStore-Upstream
          # Keep the customized LiveContainer tree untouched; only SideStore is imported.
          rsync -a --delete --exclude='.git/' /tmp/SideStore/ SideStore-Upstream/

      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SideStore-Upstream
          if git diff --cached --quiet; then
            echo "No upstream source changes to import."
            exit 0
          fi
          git commit -m "Import upstream LiveContainer + SideStore integration sources"
          git push
