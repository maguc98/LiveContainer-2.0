name: Sync upstream sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-15
    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch LiveContainer and SideStore integration sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/LiveContainer /tmp/SideStore
          git clone --recurse-submodules --branch main --single-branch https://github.com/LiveContainer/LiveContainer.git /tmp/LiveContainer
          git clone --branch LiveContainerSupport --single-branch https://github.com/LiveContainer/SideStore.git /tmp/SideStore

      - name: Import complete upstream source trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LiveContainer SideStore-Upstream
          rsync -a --delete --exclude='.git/' /tmp/LiveContainer/ LiveContainer/
          rsync -a --delete --exclude='.git/' /tmp/SideStore/ SideStore-Upstream/

      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LiveContainer SideStore-Upstream
          if git diff --cached --quiet; then
            echo "No upstream source changes to import."
            exit 0
          fi
          git commit -m "Import upstream LiveContainer + SideStore integration sources"
          git push
