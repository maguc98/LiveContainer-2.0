name: Build LiveContainer UI Branch

on:
  push:
    branches:
      - ui/multitask-glass-controls
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Prepare OpenSSL dependency
        working-directory: LiveContainer
        run: sh .github/prepare_dependencies.sh

      - name: Archive unsigned app
        working-directory: LiveContainer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../build
          set +e
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -archivePath ../build/LiveContainer.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            2>&1 | tee ../build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "===== Xcode compiler diagnostics ====="
            grep -nE 'error:|fatal error:|warning:' ../build/xcodebuild.log | tail -n 120 || true
            echo "===== End compiler diagnostics ====="
            exit "$status"
          fi

      - name: Package using the official SideStore integration script
        working-directory: LiveContainer
        shell: bash
        env:
          archive_path: ../build/LiveContainer
          scheme: LiveContainer
        run: |
          set -euo pipefail
          sh .github/build_github.sh

          test -s "LiveContainer+SideStore.ipa"
          test -s "LiveContainer.ipa"

          rm -rf ../build/verify-sidestore
          mkdir -p ../build/verify-sidestore
          unzip -q "LiveContainer+SideStore.ipa" -d ../build/verify-sidestore
          APP="../build/verify-sidestore/Payload/LiveContainer.app"

          test -d "$APP/Frameworks/SideStoreApp.framework"
          test -s "$APP/Frameworks/SideStoreApp.framework/SideStore"
          test -d "$APP/PlugIns/LiveWidgetExtension.appex"
          /usr/libexec/PlistBuddy -c 'Print :ALTAppGroups' "$APP/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP/Info.plist" >/dev/null
          unzip -t "LiveContainer+SideStore.ipa" >/dev/null
          echo "Validated SideStore-integrated IPA payload."

      - name: Upload SideStore-integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Plus-SideStore-IPA
          path: LiveContainer/LiveContainer+SideStore.ipa
          if-no-files-found: error

      - name: Upload standard IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-standard-IPA
          path: LiveContainer/LiveContainer.ipa
          if-no-files-found: error

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-xcarchive
          path: build/LiveContainer.xcarchive
          if-no-files-found: error
